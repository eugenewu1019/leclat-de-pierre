    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zinc: {
                950: '#09090b',
                900: '#18181b',
                800: '#27272a',
                700: '#3f3f46',
                600: '#52525b',
                500: '#71717a',
                400: '#a1a1aa',
                300: '#d4d4d8',
                200: '#e4e4e7',
                100: '#f4f4f5',
                50: '#fafafa',
              },
              amber: {
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
                950: '#451a03',
              }

            fontFamily: {
              'serif-display': ['Cinzel', 'serif'],
              'serif-cn': ['Noto Serif TC', 'serif'],
              'sans': ['Manrope', 'sans-serif'],
            },
            keyframes: {
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            },
            animation: {
              scan: 'scan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite',
              marquee: 'marquee 30s linear infinite',
            }
          }
        }
      }
