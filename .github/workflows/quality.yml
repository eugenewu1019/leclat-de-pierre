name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Typecheck (if present)
        run: npm run typecheck --if-present

      - name: Build (if present)
        run: npm run build --if-present

      - name: Prettier (non-code files)
        run: |
          npx --yes prettier@3.3.3 --check \
            '**/*.md' \
            '**/*.json' \
            '**/*.yml' \
            '**/*.yaml' \
            '.github/**/*'
